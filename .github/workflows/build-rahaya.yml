name: Rahaya Coffee POS Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: app-source
        run: npm install --legacy-peer-deps

      - name: Configure Supabase
        working-directory: app-source
        run: |
          set -e
          printf '%s\n' 'VITE_SUPABASE_URL=https://bmdrwuafownanwlxzqny.supabase.co' 'VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_Eov65bGxCC1Z8OnGReqq8Q_fs0E6FGm' > .env.production

      - name: Typecheck
        working-directory: app-source
        run: npm run lint

      - name: Build web for GitHub Pages
        working-directory: app-source
        env:
          GITHUB_PAGES: 'true'
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app-source/dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Rebuild web for Android
        working-directory: app-source
        env:
          GITHUB_PAGES: 'false'
        run: npm run build

      - name: Install Capacitor
        working-directory: app-source
        run: npm install --no-save --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare Android
        working-directory: app-source
        run: |
          set -e
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            printf '%s\n' '{' '  "appId": "com.rahayacoffee.pos",' '  "appName": "Rahaya Coffee POS",' '  "webDir": "dist",' '  "bundledWebRuntime": false' '}' > capacitor.config.json
          fi
          test -d android || npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: app-source/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rahaya-coffee-pos-apk
          path: app-source/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload web
        uses: actions/upload-artifact@v4
        with:
          name: rahaya-coffee-pos-web
          path: app-source/dist
          if-no-files-found: error
