name: Rahaya Coffee POS Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: app-source
        run: npm install --legacy-peer-deps

      - name: Configure Supabase
        working-directory: app-source
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -e
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" > .env.production

      - name: Typecheck
        working-directory: app-source
        run: npm run lint

      - name: Build web
        working-directory: app-source
        run: npm run build

      - name: Install Capacitor
        working-directory: app-source
        run: npm install --no-save --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare Android
        working-directory: app-source
        run: |
          set -e
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            printf '%s\n' '{' '  "appId": "com.rahayacoffee.pos",' '  "appName": "Rahaya Coffee POS",' '  "webDir": "dist",' '  "bundledWebRuntime": false' '}' > capacitor.config.json
          fi
          test -d android || npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: app-source/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rahaya-coffee-pos-apk
          path: app-source/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload web
        uses: actions/upload-artifact@v4
        with:
          name: rahaya-coffee-pos-web
          path: app-source/dist
          if-no-files-found: error
