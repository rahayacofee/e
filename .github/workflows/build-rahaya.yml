name: Build Rahaya Coffee POS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download source ZIP
        run: |
          set -e
          curl -L --fail --retry 3 -o app.zip "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/rahaya-coffee-pos-updated.zip"
          rm -rf source
          mkdir -p source
          unzip -q app.zip -d source
          echo "SOURCE TREE:"
          find source -maxdepth 3 -type f | sort | head -300

      - name: Locate project
        id: project
        shell: bash
        run: |
          set -e
          PKG="$(find source -name package.json -not -path '*/node_modules/*' | head -1 || true)"
          if [ -z "$PKG" ]; then
            echo "No package.json found"
            exit 1
          fi
          ROOT="$(dirname "$PKG")"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Project root: $ROOT"
          cat "$PKG"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          set -e
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f bun.lock ] || [ -f bun.lockb ]; then
            npm install
          else
            npm install --legacy-peer-deps
          fi

      - name: Build web application
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          set -e
          npm run build

      - name: Prepare Capacitor Android
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -e

          if [ ! -d dist ]; then
            echo "dist directory was not generated by npm run build"
            exit 1
          fi

          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android

          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.rahayacoffee.pos",
            "appName": "Rahaya Coffee POS",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF
          fi

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Build Android APK
        working-directory: ${{ steps.project.outputs.root }}/android
        run: |
          set -e
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Collect APK
        if: success()
        run: |
          set -e
          mkdir -p artifacts
          find source -type f -name '*.apk' -print -exec cp {} artifacts/ \;
          echo "APK ARTIFACTS:"
          ls -lah artifacts
          test -n "$(find artifacts -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rahaya-coffee-pos-apk
          path: artifacts/*.apk
          if-no-files-found: error
