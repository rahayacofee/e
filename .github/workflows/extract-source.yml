name: Extract Rahaya source tree

on:
  push:
    branches: [main]
    paths:
      - rahaya-coffee-pos-updated.zip
      - .github/workflows/extract-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Extract source
        run: |
          set -euo pipefail
          rm -rf app-source
          mkdir -p app-source
          unzip -q rahaya-coffee-pos-updated.zip -d app-source
          find app-source -type f | wc -l
      - name: Commit extracted source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-source
          git diff --cached --quiet && exit 0
          git commit -m "chore: extract Rahaya source for maintenance"
          git push
